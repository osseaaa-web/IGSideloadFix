name: Build IGSideloadFix IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Install theos-jailed
        run: |
          git clone https://github.com/kabiroberai/theos-jailed.git $THEOS/vendor/theos-jailed

      - name: Download Instagram IPA
        run: |
          # Здесь нужно указать прямую ссылку на ваш расшифрованный IPA 450.1.0
          # Например, если вы загрузили его в GitHub Releases или на файлообменник
          curl -L -o Instagram.ipa "https://github.com/osseaaa-web/IGSideloadFix/releases/download/qweqwe/com.burbn.instagram_450.1.0_und3fined.ipa"

      - name: Build IPA
        run: make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IGSideloadFix-IPA
          path: packages/*.ipa
